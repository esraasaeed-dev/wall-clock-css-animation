<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wall Clock - CSS Animation Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="numbers">
          <span class="dash dash12">|</span>
          <span class="number number12"> 12</span>

          <span class="number number1"> 1</span>
          <span class="dash dash1">|</span>

          <span class="dash dash2">|</span>
          <span class="number number2"> 2 </span>

          <span class="number number3"> 3 </span>
          <span class="dash dash3">|</span>

          <span class="number number4"> 4 </span>
          <span class="dash dash4">|</span>

          <span class="number number5">5 </span>
          <span class="dash dash5">|</span>

          <span class="dash dash6">|</span>
          <span class="number number6"> 6 </span>

          <span class="dash dash7">|</span>
          <span class="number number7"> 7 </span>

          <span class="dash dash8">|</span>
          <span class="number number8"> 8 </span>

          <span class="dash dash9">|</span>
          <span class="number number9"> 9 </span>

          <span class="dash dash10">|</span>
          <span class="number number10"> 10 </span>

          <span class="dash dash11">|</span>
          <span class="number number11"> 11 </span>
        </div>
        <div class="clock-title">TIMELESS</div>
        <div class="clock-bar-seconds"></div>
        <div class="clock-bar-minutes"></div>
        <div class="clock-bar-hours"></div>
        <div class="clock-circle"></div>
      </div>
      <div class="signature">
        by <strong>Esraa</strong>
      </div>
    </div>
  </body>
</html>
